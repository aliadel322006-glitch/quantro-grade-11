    <main>
      <span aria-hidden="true">↻</span>
      <h1>You are offline · أنت غير متصل</h1>

      <p dir="rtl">ما زالت الدروس التي نزّلتها متاحة. ارجع إلى التطبيق واختر درسًا محفوظًا.</p>
