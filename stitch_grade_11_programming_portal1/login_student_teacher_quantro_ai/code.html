<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quantro AI - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

                        "on-tertiary-fixed": "#2a1700",
                        "secondary": "#006c49",
                        "tertiary-fixed": "#ffddb8",

                        "surface-container-low": "#eff4ff",
                        "surface-dim": "#cbdbf5",
                        "on-secondary-container": "#00714d",
                        "surface-tint": "#4d44e3",
                        "surface-container-high": "#dce9ff",
                        "on-primary-fixed": "#0f0069",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#213145",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-tertiary-container": "#ffd4a4",
                        "secondary-container": "#6cf8bb",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#0b1c30",
                        "surface-variant": "#d3e4fe",
                        "on-secondary-fixed-variant": "#005236",
                        "on-surface-variant": "#464555",
                        "primary-fixed": "#e2dfff",
                        "on-secondary-fixed": "#002113",
                        "tertiary-fixed-dim": "#ffb95f",
                        "primary-fixed-dim": "#c3c0ff",
                        "background": "#f8f9ff",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "sidebar-width": "260px",
                        "card-padding": "20px",
                        "gutter": "24px",
                        "container-max": "1440px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],

                        "headline-md": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"]

                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

            }

<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased p-4">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] p-8 sm:p-10">
<!-- Brand/Logo -->
<div class="flex flex-col items-center mb-8">
<div class="flex items-center justify-center w-12 h-12 bg-primary-container text-on-primary-container rounded-lg mb-4">
<span class="material-symbols-outlined text-3xl">psychology</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary text-center">Quantro AI</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">Learn. Understand. Achieve.</p>
</div>
<!-- Welcome Text -->
<div class="mb-6">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div><div class="flex p-1 bg-surface-container rounded-lg mb-6">
<button class="flex-1 py-2 text-label-md font-medium rounded-md bg-surface-container-lowest text-primary shadow-sm transition-all" type="button">
    طالب
  </button>
<button class="flex-1 py-2 text-label-md font-medium rounded-md text-on-surface-variant hover:text-on-surface transition-all" type="button">
    معلم
  </button>
</div>
<!-- Login Form -->
<form action="#" class="space-y-5" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="email">Email or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-lg">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-on-surface font-body-md focus:ring-primary focus:border-primary focus:shadow-[0_0_0_3px_rgba(79,70,229,0.15)] transition-all outline-none" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-lg">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-on-surface font-body-md focus:ring-primary focus:border-primary focus:shadow-[0_0_0_3px_rgba(79,70,229,0.15)] transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-lg">visibility_off</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant/50 rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me
                    </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-variant transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-white bg-[#4F46E5] hover:bg-[#4338ca] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                    Sign in
                </button>
</div>
</form>
<!-- Divider -->
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-body-sm text-body-sm">Or continue with</span>
</div>
</div>
</div>
<!-- Social Login -->
<div class="mt-6 grid grid-cols-2 gap-3">
<button class="w-full flex justify-center items-center py-2.5 px-4 border border-outline-variant/50 rounded-lg shadow-sm bg-surface-container-lowest text-sm font-medium text-on-surface hover:bg-surface-container-low transition-colors" type="button">
<svg aria-hidden="true" class="h-5 w-5 mr-2" viewbox="0 0 24 24">
<path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335"></path>
<path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"></path>
<path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"></path>
<path d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26538 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z" fill="#34A853"></path>
</svg>
<span class="font-label-md text-label-md">Google</span>
</button>
<button class="w-full flex justify-center items-center py-2.5 px-4 border border-outline-variant/50 rounded-lg shadow-sm bg-surface-container-lowest text-sm font-medium text-on-surface hover:bg-surface-container-low transition-colors" type="button">
<svg aria-hidden="true" class="h-5 w-5 mr-2 text-[#000000]" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
<span class="font-label-md text-label-md">GitHub</span>
</button>
</div>
<!-- Sign Up Link -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-variant transition-colors ml-1" href="#">
                    Create an account
                </a>
</p>
</div>
</main>
</body></html>
